apiVersion: apps/v1
kind: Deployment

metadata:
  name: blog-api
  labels:
    app: blog-api

spec:
  replicas: 4

  selector:
    matchLabels:
      app: blog-api

  template:
    metadata:
      labels:
        app: blog-api

    spec:
      containers:
      - name: blog-api

        image: 688600819893.dkr.ecr.eu-north-1.amazonaws.com/blog-api:latest

        ports:
        - containerPort: 3000

        env:
        - name: DB_HOST
          value: postgres

        - name: DB_PORT
          value: "5432"

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_USER

        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_PASS

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_NAME
